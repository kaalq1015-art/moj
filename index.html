<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>رسالة إلى خالتي الغالية</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Aref Ruqaa & Cairo for UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold-light: #fbf5e6;
            --gold-primary: #D4AF37;
            --gold-dark: #aa7c11;
            /* Premium Cream to Soft Pink Gradient */
            --bg-gradient: linear-gradient(135deg, #FFF9F6 0%, #FFF0F2 50%, #FFE4E8 100%);
        }

        body {
            font-family: 'Aref Ruqaa', serif;
            background: var(--bg-gradient);
            color: #4A3B32; /* Rich warm dark brown */
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .font-ui {
            font-family: 'Cairo', sans-serif;
        }

        /* Gold gradient text with safety padding to prevent glyph/dots clipping on mobile browsers */
        .text-gold-gradient {
            background: linear-gradient(135deg, #F3E5AB 0%, #D4AF37 40%, #B38728 70%, #9A7B1C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: #D4AF37;
            padding-top: 10px;
            padding-bottom: 10px;
            display: inline-block;
            overflow: visible;
            line-height: 1.8;
            filter: drop-shadow(0px 2px 4px rgba(212, 175, 55, 0.15));
        }

        /* Pulsing heart inside the intro */
        @keyframes heartBeat {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.5)); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.8)); }
        }
        .pulse-heart {
            animation: heartBeat 1.8s infinite ease-in-out;
        }

        /* Ambient soft golden glow */
        .ambient-glow {
            background: radial-gradient(circle, rgba(251, 245, 230, 0.95) 0%, rgba(255, 240, 242, 0) 80%);
            filter: blur(12px);
        }

        /* Elegant text backings (halo effect for high contrast over elements) */
        .text-halo {
            background: radial-gradient(circle, rgba(255, 255, 255, 0.98) 0%, rgba(255, 255, 255, 0.85) 70%, rgba(255, 255, 255, 0) 100%);
            box-shadow: 0 10px 45px rgba(212, 175, 55, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.08);
        }

        /* Butterfly fluttering animation */
        @keyframes flutter {
            0%, 100% { transform: scaleX(1) rotate(0deg); }
            50% { transform: scaleX(0.2) rotate(10deg); }
        }

        @keyframes drift {
            0% { transform: translateY(110vh) translateX(0) scale(0.8); opacity: 0; }
            10% { opacity: 0.9; }
            90% { opacity: 0.9; }
            100% { transform: translateY(-10vh) translateX(50px) scale(1); opacity: 0; }
        }

        .butterfly {
            position: absolute;
            pointer-events: none;
            z-index: 15;
            animation: drift 14s infinite linear;
        }

        .butterfly-wings {
            animation: flutter 0.15s infinite ease-in-out;
        }

        /* Beautiful smooth transitions for screens */
        .screen-transition {
            transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .screen-hidden {
            opacity: 0;
            transform: scale(0.97) translateY(10px);
            pointer-events: none;
            position: absolute;
        }

        .screen-visible {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        /* Progress indicator bar */
        .progress-indicator {
            height: 3px;
            background: linear-gradient(to left, transparent, var(--gold-primary), transparent);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            transition: width 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="w-full h-screen flex flex-col justify-between items-center relative p-6 overflow-hidden select-none">

    <!-- Sparkle Canvas Overlay (For falling rose petals & light shimmer) -->
    <canvas id="canvas-overlay" class="absolute inset-0 pointer-events-none z-10"></canvas>

    <!-- Subtle, Elegant Minimalist Botanical Elements (Corner Flowers) -->
    <!-- Top Right Flower Branch -->
    <div class="absolute top-0 right-0 w-32 h-32 md:w-48 md:h-48 text-amber-600/10 pointer-events-none z-0">
        <svg class="w-full h-full" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1.2">
            <path d="M120,0 C100,20 60,30 20,80 C10,90 5,100 0,120" />
            <!-- Soft flower buds -->
            <circle cx="60" cy="35" r="2.5" fill="currentColor" />
            <path d="M60,35 C55,27 47,27 47,35 C47,43 55,43 60,35 Z" />
            <path d="M60,35 C65,27 73,27 73,35 C73,43 65,43 60,35 Z" />
            <path d="M60,35 C52,31 52,22 60,22 C68,22 68,31 60,35 Z" />
            <!-- Soft leaves -->
            <path d="M90,18 C85,24 88,32 95,30 C102,28 100,20 90,18 Z" fill="currentColor" opacity="0.3"/>
            <path d="M40,55 C33,52 30,59 33,66 C36,73 45,68 40,55 Z" fill="currentColor" opacity="0.3"/>
        </svg>
    </div>

    <!-- Bottom Left Flower Branch -->
    <div class="absolute bottom-0 left-0 w-32 h-32 md:w-48 md:h-48 text-amber-600/10 pointer-events-none z-0 transform rotate-180">
        <svg class="w-full h-full" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1.2">
            <path d="M120,0 C100,20 60,30 20,80 C10,90 5,100 0,120" />
            <circle cx="60" cy="35" r="2.5" fill="currentColor" />
            <path d="M60,35 C55,27 47,27 47,35 C47,43 55,43 60,35 Z" />
            <path d="M60,35 C65,27 73,27 73,35 C73,43 65,43 60,35 Z" />
            <path d="M60,35 C52,31 52,22 60,22 C68,22 68,31 60,35 Z" />
            <path d="M90,18 C85,24 88,32 95,30 C102,28 100,20 90,18 Z" fill="currentColor" opacity="0.3"/>
            <path d="M40,55 C33,52 30,59 33,66 C36,73 45,68 40,55 Z" fill="currentColor" opacity="0.3"/>
        </svg>
    </div>

    <!-- Interactive Fluttering Butterflies -->
    <div class="butterfly" style="left: 12%; animation-delay: 0s; animation-duration: 18s;">
        <svg class="butterfly-wings w-8 h-8 text-amber-500/35" viewBox="0 0 100 100" fill="currentColor">
            <path d="M50,50 C30,30 10,40 15,60 C20,80 40,75 50,55 C60,75 80,80 85,60 C90,40 70,30 50,50 Z M50,50 C45,35 30,20 35,10 C40,0 50,20 50,35 C50,20 60,0 65,10 C70,20 55,35 50,50 Z"/>
        </svg>
    </div>
    <div class="butterfly" style="right: 15%; animation-delay: 4s; animation-duration: 22s;">
        <svg class="butterfly-wings w-10 h-10 text-pink-400/35" viewBox="0 0 100 100" fill="currentColor">
            <path d="M50,50 C30,30 10,40 15,60 C20,80 40,75 50,55 C60,75 80,80 85,60 C90,40 70,30 50,50 Z M50,50 C45,35 30,20 35,10 C40,0 50,20 50,35 C50,20 60,0 65,10 C70,20 55,35 50,50 Z"/>
        </svg>
    </div>

    <!-- Soft Golden Ambient Glow Base -->
    <div class="absolute inset-0 ambient-glow pointer-events-none z-0"></div>

    <!-- Header Section (Subtle and ultra-clean golden progress line) -->
    <div class="w-full max-w-md flex flex-col items-center z-30 pt-6">
        <div class="w-24 h-[1px] bg-amber-500/20 relative">
            <div id="progress-bar" class="progress-indicator w-0 h-full absolute top-0 right-0"></div>
        </div>
    </div>

    <!-- ================= FIXED CONTROL PANEL (DOES NOT SCALE) ================= -->
    <!-- Positioned absolutely at the top to remain clickable, clear, and unscaled -->
    <div class="absolute top-14 flex items-center justify-center gap-3 bg-white/80 backdrop-blur-md px-4 py-2 rounded-2xl border border-amber-500/15 shadow-sm z-50 transition-all duration-300" id="global-controls">
        <button id="btn-zoom-out" class="w-9 h-9 flex items-center justify-center rounded-xl bg-amber-500/5 border border-amber-500/10 hover:bg-amber-500/10 active:scale-95 transition-all text-amber-800 font-bold text-xs font-ui">
            A-
        </button>
        <!-- Dynamic Size Indicator Display -->
        <span id="zoom-indicator" class="text-xs font-ui text-amber-800/80 font-bold px-1 min-w-[40px] text-center">100%</span>
        <button id="btn-zoom-in" class="w-9 h-9 flex items-center justify-center rounded-xl bg-amber-500/5 border border-amber-500/10 hover:bg-amber-500/10 active:scale-95 transition-all text-amber-800 font-bold text-sm font-ui">
            A+
        </button>
        
        <div class="w-[1px] h-6 bg-amber-500/20 mx-1"></div>
        
        <!-- Upgraded Fullscreen with Fallback capabilities -->
        <button id="btn-fullscreen" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-amber-500/10 border border-amber-500/20 hover:bg-amber-500/20 active:scale-95 transition-all text-amber-800 text-xs font-bold font-ui">
            <svg id="fullscreen-icon" class="w-3.5 h-3.5 text-amber-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5v-4m0 4h-4m4 0l-5-5"/>
            </svg>
            <span id="fullscreen-text">ملء الشاشة</span>
        </button>
    </div>

    <!-- ================= ELEGANT FALLBACK TOAST NOTIFICATION ================= -->
    <div id="fullscreen-toast" class="fixed top-28 left-1/2 transform -translate-x-1/2 bg-stone-900/95 text-amber-100 text-xs md:text-sm px-5 py-3 rounded-2xl shadow-2xl z-50 transition-all duration-500 opacity-0 scale-95 pointer-events-none flex items-center gap-2 border border-amber-500/30 font-ui text-center max-w-[90%]">
        <span>✨ للحصول على تجربة ملء الشاشة الكاملة والغامرة، يرجى فتح الرابط من المتصفح مباشرة (سفاري أو كروم) ✨</span>
    </div>

    <!-- Interactive Tap Zone / Main Screen Container (Inline font-size scaling is applied directly here) -->
    <div id="main-interactive-zone" class="w-full max-w-lg flex-grow flex flex-col justify-center items-center text-center px-4 relative z-20 cursor-pointer" style="font-size: 16px;">
        
        <!-- ================= 1. INTRO SCREEN ================= -->
        <div id="screen-intro" class="screen-transition screen-visible flex flex-col items-center justify-center w-full">
            <!-- Pulsing Emblem -->
            <div class="relative w-36 h-36 flex items-center justify-center mb-8">
                <!-- Golden Floral/Circle Border -->
                <svg class="absolute w-full h-full text-amber-500/20 animate-[spin_45s_linear_infinite]" viewBox="0 0 120 120">
                    <circle cx="60" cy="60" r="54" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="8,5"/>
                    <circle cx="60" cy="60" r="48" fill="none" stroke="currentColor" stroke-width="0.5"/>
                </svg>
                <!-- Central Elegant Heart -->
                <div class="w-18 h-18 bg-white/80 rounded-full flex items-center justify-center border border-amber-200 shadow-[0_4px_15px_rgba(212,175,55,0.1)]">
                    <svg class="w-10 h-10 text-pink-400 pulse-heart" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"/>
                    </svg>
                </div>
            </div>

            <!-- Intro Title using dynamic em scale -->
            <h1 class="text-[2.6em] md:text-[3.2em] font-bold text-gold-gradient mb-8 px-4" style="line-height: 1.4;">رسالة من القلب..</h1>
            
            <div class="px-7 py-3.5 border border-amber-500/20 rounded-full bg-white/70 backdrop-blur-sm shadow-sm animate-pulse">
                <span class="text-base font-semibold font-ui text-amber-700/85">المسي الشاشة لفتح الرسالة يا خالتي ✨</span>
            </div>
        </div>

        <!-- ================= 2. CAROUSEL SLIDES ================= -->
        <div id="screen-slides" class="screen-transition screen-hidden w-full flex flex-col items-center justify-center min-h-[300px]">
            <div class="relative px-6 py-12 rounded-3xl w-full text-halo">
                <!-- Text Container with scalable font styling - using raw em sizes -->
                <p id="slide-text" class="text-[1.8em] md:text-[2.5em] leading-relaxed text-stone-800 px-2 text-center select-none font-bold">
                    <!-- Text injected dynamically -->
                </p>
            </div>
        </div>

        <!-- ================= 2.5. STANDALONE "قريباً" SCREEN ================= -->
        <div id="screen-soon" class="screen-transition screen-hidden w-full flex flex-col items-center justify-center">
            
            <!-- Big Golden Spotlight for "قريباً" with absolute overflow protection for perfect points visibility -->
            <div class="relative flex items-center justify-center w-full py-4 overflow-visible">
                <!-- Golden glow background aura -->
                <div class="absolute w-72 h-72 bg-amber-200/25 rounded-full blur-3xl"></div>
                
                <!-- Display block with line-height 1.8 to prevent dots clipping and slightly increased size -->
                <h2 class="text-[5.5em] md:text-[7em] font-bold text-gold-gradient tracking-wide relative z-10 py-6 px-8 text-center animate-[pulse_2.5s_infinite_ease-in-out]" style="font-family: 'Aref Ruqaa', serif; overflow: visible; display: block; line-height: 1.8;">
                    قَرِيباً
                </h2>
            </div>
        </div>

        <!-- ================= 3. GRAND REVEAL SCREEN ================= -->
        <div id="screen-reveal" class="screen-transition screen-hidden w-full flex flex-col items-center justify-center">
            
            <!-- Ultimate Heartwarming Message Panel with larger text styling using em -->
            <div class="relative px-6 py-8 md:py-12 rounded-3xl w-full text-halo mb-8 overflow-visible flex flex-col items-center">
                <!-- Main Big Poetic Message -->
                <p class="text-[1.8em] md:text-[2.2em] text-stone-800 font-bold mb-6 leading-relaxed">
                    سيجعلكِ بإذن الله أجمل خالة لقطعةٍ من روحه!
                </p>
                
                <!-- Elegant decorative divider -->
                <div class="w-28 h-[1.5px] bg-amber-500/20 my-2"></div>
                
                <!-- Separated Mini Baby Card - Clear Hierarchy with Poetic Introduction and Baby Icon -->
                <div class="mt-4 px-6 py-5 bg-amber-50/40 rounded-2xl border border-amber-500/15 w-full max-w-sm flex flex-col items-center shadow-inner overflow-visible">
                    <!-- Elegant Baby Signature Indicator -->
                    <div class="flex items-center gap-1.5 mb-2">
                        <span class="text-[0.9em] font-ui tracking-wide text-amber-700/85 font-semibold uppercase">
                            طفلي يهمس لكِ بصوتٍ لم تسمعيه بعد:
                        </span>
                    </div>
                    
                    <!-- Baby statement - Perfectly clean, distinct, and enlarged -->
                    <p class="text-[1.5em] md:text-[2em] text-amber-800 font-bold text-center leading-normal py-2 px-2 overflow-visible" style="font-family: 'Aref Ruqaa', serif; min-height: 1.6em;">
                        مبارك يا خالة أبي الغالية! ❤️
                    </p>
                </div>
            </div>

            <!-- Replay Button -->
            <button id="btn-replay" class="px-8 py-3.5 rounded-full border border-amber-500/20 bg-white/90 hover:bg-white text-amber-700 font-semibold font-ui text-sm transition-all duration-300 transform active:scale-95 shadow-[0_4px_12px_rgba(212,175,55,0.1)] flex items-center gap-2 z-30">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 8H17"/>
                </svg>
                <span>إعادة عرض الرسالة</span>
            </button>
        </div>

    </div>

    <!-- Empty Bottom Spacer -->
    <div class="w-full h-8 pointer-events-none z-30"></div>

    <!-- Scripting and Interactive Engine -->
    <script>
        // Exactly requested texts in absolute order with user edits applied (removed Slide 4 "أنت من أول", Slide 5 changed to "ولأن فرحتي ليست فرحةً")
        const slides = [
            "إلى خالتي الحبيبة.. رائحةُ أُمّي",
            "أنتِ الغيمةُ التي تُمطرنا حُباً، والقلبُ الذي لا يملُّ من العطاء",
            "لا أذكر فرحةً في عمري.. إلا وكنتِ أنتِ بهجتَها",
            "ولأن فرحتي ليست فرحةً.. ما لم تكن فرحتكِ",
            "اليوم لديّ خبرٌ يستحقُ أن تكوني أول من يسمعه",
            "استعدي لدورٍ وحُبٍّ جديد..",
            "لأن ابن أختكِ.."
        ];

        let currentState = "intro"; // states: intro, slides, soon, reveal
        let currentSlideIndex = 0;
        let isTransitioning = false;
        
        // Font sizing state (Calculated in base px size)
        let currentFontSize = 16; 
        const minFontSize = 12;
        const maxFontSize = 24;

        // Elements
        const interactiveZone = document.getElementById("main-interactive-zone");
        const screenIntro = document.getElementById("screen-intro");
        const screenSlides = document.getElementById("screen-slides");
        const screenSoon = document.getElementById("screen-soon");
        const screenReveal = document.getElementById("screen-reveal");
        const slideText = document.getElementById("slide-text");
        const progressBar = document.getElementById("progress-bar");
        const btnReplay = document.getElementById("btn-replay");

        // Controls
        const btnZoomIn = document.getElementById("btn-zoom-in");
        const btnZoomOut = document.getElementById("btn-zoom-out");
        const zoomIndicator = document.getElementById("zoom-indicator");
        const btnFullscreen = document.getElementById("btn-fullscreen");
        const fullscreenText = document.getElementById("fullscreen-text");
        const globalControls = document.getElementById("global-controls");
        const toast = document.getElementById("fullscreen-toast");

        // Font Resize Logic (Directly modifies base font-size of main container)
        function updateZoomDisplay() {
            interactiveZone.style.fontSize = `${currentFontSize}px`;
            const percentage = Math.round((currentFontSize / 16) * 100);
            zoomIndicator.innerText = `${percentage}%`;
        }

        btnZoomIn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (currentFontSize < maxFontSize) {
                currentFontSize += 2;
                updateZoomDisplay();
            }
        });

        btnZoomOut.addEventListener("click", (e) => {
            e.stopPropagation();
            if (currentFontSize > minFontSize) {
                currentFontSize -= 2;
                updateZoomDisplay();
            }
        });

        // Safe Fallback Toast message if device blocks fullscreen (especially in platform iframes)
        function showFullscreenToast() {
            toast.classList.remove("opacity-0", "scale-95", "pointer-events-none");
            toast.classList.add("opacity-100", "scale-100");
            setTimeout(() => {
                toast.classList.add("opacity-0", "scale-95", "pointer-events-none");
                toast.classList.remove("opacity-100", "scale-100");
            }, 6000);
        }

        // Fullscreen Toggle Logic
        function toggleFullscreen() {
            const docEl = document.documentElement;
            
            // Checking if we are currently fullscreen (standard or vendor-specific)
            const isCurrentlyFullscreen = document.fullscreenElement || 
                                          document.mozFullScreenElement || 
                                          document.webkitFullscreenElement || 
                                          document.msFullscreenElement;

            if (!isCurrentlyFullscreen) {
                // Determine standard or fallback request methods
                const requestFS = docEl.requestFullscreen || 
                                  docEl.mozRequestFullScreen || 
                                  docEl.webkitRequestFullscreen || 
                                  docEl.msRequestFullscreen;

                if (requestFS) {
                    requestFS.call(docEl)
                        .then(() => {
                            updateFullscreenButton(true);
                        })
                        .catch(err => {
                            console.log("Native fullscreen blocked by iframe constraints. Displaying toast guidance.");
                            showFullscreenToast();
                        });
                } else {
                    showFullscreenToast();
                }
            } else {
                const exitFS = document.exitFullscreen || 
                               document.mozCancelFullScreen || 
                               document.webkitExitFullscreen || 
                               document.msExitFullscreen;

                if (exitFS) {
                    exitFS.call(document)
                        .then(() => {
                            updateFullscreenButton(false);
                        })
                        .catch(err => {
                            console.log("Error leaving native fullscreen:", err);
                        });
                } else {
                    updateFullscreenButton(false);
                }
            }
        }

        function updateFullscreenButton(isActive) {
            if (isActive) {
                fullscreenText.innerText = "تصغير";
            } else {
                fullscreenText.innerText = "ملء الشاشة";
            }
        }

        // Listen for native escape/exit fullscreen changes to synchronize UI text state
        function syncFullscreenUI() {
            const isFS = document.fullscreenElement || 
                         document.mozFullScreenElement || 
                         document.webkitFullscreenElement || 
                         document.msFullscreenElement;
            updateFullscreenButton(!!isFS);
        }

        document.addEventListener('fullscreenchange', syncFullscreenUI);
        document.addEventListener('webkitfullscreenchange', syncFullscreenUI);
        document.addEventListener('mozfullscreenchange', syncFullscreenUI);
        document.addEventListener('MSFullscreenChange', syncFullscreenUI);

        btnFullscreen.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleFullscreen();
        });

        // Interaction Handling - Simplified standard click prevents gestural security blocking on Safari/Chrome
        interactiveZone.addEventListener("click", (e) => {
            if (e.target.closest("#btn-replay") || e.target.closest("#global-controls")) return;
            handleNavigation();
        });

        btnReplay.addEventListener("click", (e) => {
            e.stopPropagation();
            resetPresentation();
        });

        function handleNavigation() {
            if (isTransitioning) return;

            if (currentState === "intro") {
                transitionToSlides();
            } else if (currentState === "slides") {
                if (currentSlideIndex < slides.length - 1) {
                    nextSlide();
                } else {
                    transitionToSoon(); // Independent "قريباً" Screen
                }
            } else if (currentState === "soon") {
                transitionToReveal(); // Final reveal step
            }
        }

        function transitionToSlides() {
            isTransitioning = true;
            
            // Hide the controls with a clean fade-out so they don't distract during poetry
            globalControls.style.opacity = "0";
            globalControls.style.pointerEvents = "none";

            fade(screenIntro, "out", () => {
                screenIntro.classList.add("screen-hidden");
                screenIntro.classList.remove("screen-visible");
                
                screenSlides.classList.remove("screen-hidden");
                currentSlideIndex = 0;
                displayCurrentSlide();
                
                setTimeout(() => {
                    fade(screenSlides, "in", () => {
                        currentState = "slides";
                        isTransitioning = false;
                    });
                }, 50);
            });
        }

        function nextSlide() {
            isTransitioning = true;
            fade(screenSlides, "out", () => {
                currentSlideIndex++;
                displayCurrentSlide();
                setTimeout(() => {
                    fade(screenSlides, "in", () => {
                        isTransitioning = false;
                    });
                }, 50);
            });
        }

        function displayCurrentSlide() {
            slideText.innerHTML = slides[currentSlideIndex];
            
            // Adjust dynamic em-sizes based on slide length
            if (slides[currentSlideIndex].length > 45) {
                slideText.className = "text-[1.6em] md:text-[2.2em] leading-relaxed text-stone-800 px-2 font-bold";
            } else {
                slideText.className = "text-[2.2em] md:text-[3em] leading-relaxed text-stone-800 px-2 font-bold";
            }

            // Progress bar mapping
            const total = slides.length;
            const percentage = ((currentSlideIndex + 1) / (total + 1)) * 100; // Leave room for soon
            progressBar.style.width = `${percentage}%`;
        }

        function transitionToSoon() {
            isTransitioning = true;
            fade(screenSlides, "out", () => {
                screenSlides.classList.add("screen-hidden");
                screenSlides.classList.remove("screen-visible");
                
                screenSoon.classList.remove("screen-hidden");
                progressBar.style.width = "95%"; // Almost complete
                
                setTimeout(() => {
                    fade(screenSoon, "in", () => {
                        currentState = "soon";
                        isTransitioning = false;
                    });
                }, 50);
            });
        }

        function transitionToReveal() {
            isTransitioning = true;
            fade(screenSoon, "out", () => {
                screenSoon.classList.add("screen-hidden");
                screenSoon.classList.remove("screen-visible");
                
                screenReveal.classList.remove("screen-hidden");
                progressBar.style.width = "100%";
                
                setTimeout(() => {
                    fade(screenReveal, "in", () => {
                        currentState = "reveal";
                        isTransitioning = false;
                    });
                }, 50);
            });
        }

        function resetPresentation() {
            isTransitioning = true;
            fade(screenReveal, "out", () => {
                screenReveal.classList.add("screen-hidden");
                screenReveal.classList.remove("screen-visible");
                
                screenIntro.classList.remove("screen-hidden");
                progressBar.style.width = "0%";
                currentState = "intro";
                
                // Show control panel again on intro screen
                globalControls.style.opacity = "1";
                globalControls.style.pointerEvents = "auto";

                setTimeout(() => {
                    fade(screenIntro, "in", () => {
                        isTransitioning = false;
                    });
                }, 50);
            });
        }

        function fade(element, dir, callback) {
            if (dir === "out") {
                element.style.opacity = "0";
                element.style.transform = "scale(0.97) translateY(-5px)";
                setTimeout(callback, 800);
            } else {
                element.style.opacity = "1";
                element.style.transform = "scale(1) translateY(0)";
                if (callback) setTimeout(callback, 800);
            }
        }

        // ================= CANVASES & FLOWERS SIMULATION =================
        const canvas = document.getElementById("canvas-overlay");
        const ctx = canvas.getContext("2d");

        let itemsArray = [];
        const petalCount = 22; // Controlled count for elegance
        const shimmerCount = 18;

        function setCanvasBounds() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        setCanvasBounds();
        window.addEventListener("resize", setCanvasBounds);

        // Rose Petal Class
        class RosePetal {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height;
                this.size = Math.random() * 15 + 10;
                this.speedY = Math.random() * 1.2 + 0.6; // Gentle fall
                this.speedX = Math.random() * 1 - 0.5;   // Swaying
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 1 - 0.5;
                // Soft elegant pink shades
                this.color = `rgba(255, ${Math.floor(Math.random() * 40) + 160}, ${Math.floor(Math.random() * 30) + 180}, ${Math.random() * 0.4 + 0.4})`;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.y / 30) * 0.2; // organic sway
                this.rotation += this.rotationSpeed;

                // Reset when off bottom
                if (this.y > canvas.height) {
                    this.y = -20;
                    this.x = Math.random() * canvas.width;
                    this.rotation = Math.random() * 360;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                
                // Draw an organic romantic heart-shaped petal curve
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-this.size, -this.size, -this.size * 1.5, this.size / 3, 0, this.size * 1.5);
                ctx.bezierCurveTo(this.size * 1.5, this.size / 3, this.size, -this.size, 0, 0);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }

        // Soft Golden Shimmer/Sparkle Class
        class ShimmerPoint {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.5;
                this.alpha = Math.random() * 0.5 + 0.1;
                this.pulseRate = Math.random() * 0.015 + 0.005;
            }

            update() {
                this.alpha += this.pulseRate;
                if (this.alpha > 0.8 || this.alpha < 0.1) {
                    this.pulseRate = -this.pulseRate;
                }
            }

            draw() {
                ctx.save();
                ctx.shadowBlur = 4;
                ctx.shadowColor = "#D4AF37";
                ctx.fillStyle = `rgba(212, 175, 55, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function populateOverlay() {
            itemsArray = [];
            for (let i = 0; i < petalCount; i++) {
                itemsArray.push(new RosePetal());
            }
            for (let i = 0; i < shimmerCount; i++) {
                itemsArray.push(new ShimmerPoint());
            }
        }

        function runOverlayLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < itemsArray.length; i++) {
                itemsArray[i].update();
                itemsArray[i].draw();
            }
            requestAnimationFrame(runOverlayLoop);
        }

        // Initialize simulation & zoom scale
        populateOverlay();
        runOverlayLoop();
        updateZoomDisplay();
    </script>
</body>
</html>
